name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Resolve pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content eng/Franthropy.Version.props
          $franthropy = ([string]$props.Project.PropertyGroup.FranthropyPackageVersion).Replace('0.1.0-commit.', '')
          $core = (Get-Content eng/craft-architect.ref -Raw).Trim()
          foreach ($dependency in @(@('Franthropy', $franthropy), @('XIV-Craft-Architect', $core))) {
            if ($dependency[1] -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid dependency pin' }
            $path = "artifacts/dependencies/$($dependency[0])"
            git init $path
            git -C $path remote add origin "https://github.com/FranFkntastic/$($dependency[0]).git"
            git -C $path fetch --depth=1 origin $dependency[1]
            if ($LASTEXITCODE) { throw 'Dependency fetch failed' }
            git -C $path checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -or (git -C $path rev-parse HEAD) -ne $dependency[1]) { throw 'Dependency identity mismatch' }
          }
          $dalamud = Join-Path $env:GITHUB_WORKSPACE 'artifacts/build-references/XIVLauncher/addon/Hooks/dev'
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile artifacts/dalamud.zip
          Expand-Archive artifacts/dalamud.zip $dalamud
          "DALAMUD_HOME=$dalamud" >> $env:GITHUB_ENV
          "FranthropySource=Local" >> $env:GITHUB_ENV
          "FranthropyRoot=$env:GITHUB_WORKSPACE/artifacts/dependencies/Franthropy" >> $env:GITHUB_ENV
          "CraftArchitectCoreProject=$env:GITHUB_WORKSPACE/artifacts/dependencies/XIV-Craft-Architect/src/FFXIV Craft Architect.Core/FFXIV Craft Architect.Core.csproj" >> $env:GITHUB_ENV
      - name: Build against exact source pins without a local feed
        run: dotnet build Squire.slnx -c Release -p:ShouldUnsetParentConfigurationAndPlatform=false "-p:AppData=$env:GITHUB_WORKSPACE/artifacts/build-references"
